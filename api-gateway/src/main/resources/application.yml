server:
  port: 8080

spring:
  application:
    name: API-GATEWAY


  cloud:
    gateway:
      routes:
        - id: patient-service
          uri: lb://PATIENT-SERVICE
          predicates:
            - Path=/patient-service/**
          filters:
            - RewritePath=/patient-service/(?<remaining>.*), /patient/v1/${remaining}

        - id: doctor-service
          uri: lb://DOCTOR-SERVICE
          predicates:
            - Path=/doctor-service/**
          filters:
            - RewritePath=/doctor-service/(?<remaining>.*), /doctor/v1/${remaining}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
